name: Clutch
options:
  bundleIdPrefix: com.clutch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.6.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Clutch:
    type: application
    platform: iOS
    sources:
      - path: Clutch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clutch.mobile
        INFOPLIST_FILE: Clutch/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore

  ClutchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClutchTests
    dependencies:
      - target: Clutch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clutch.mobile.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Clutch:
    build:
      targets:
        Clutch: all
        ClutchTests: [test]
    run:
      config: Debug
      environmentVariables:
        USE_FIREBASE_EMULATORS: "1"
    test:
      config: Debug
      targets:
        - ClutchTests
